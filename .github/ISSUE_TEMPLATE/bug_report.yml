name: Bug report
description: Report a reproducible problem in Adonis Web Kit.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [GitHub Private Vulnerability Reporting](https://github.com/gabrielmaialva33/adonis-web-kit/security/advisories/new), not this public form.
        Read [CONTRIBUTING.md](https://github.com/gabrielmaialva33/adonis-web-kit/blob/master/CONTRIBUTING.md). Remove secrets and personal data from all evidence.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This report contains no vulnerability details, credentials, or private data.
          required: true
  - type: input
    id: revision
    attributes:
      label: Repository version or commit
      description: Include the commit SHA or tag and whether this reproduces on current master.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of node --version (the repository pin is in .nvmrc).
      placeholder: v24.21.0
    validations:
      required: true
  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      description: Output of pnpm --version.
      placeholder: 11.22.0
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database engine and version
      description: Include DB_CONNECTION and engine version; do not paste connection strings.
      placeholder: PostgreSQL 16, DB_CONNECTION=postgres
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage driver (DRIVE_DISK)
      options:
        - fs
        - s3
        - spaces
        - r2
        - gcs
        - Other (describe below)
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/version if relevant, Redis version, local or remote Docker context, and relevant configuration without secret values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction with synthetic data and exact commands or actions.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs and error output
      description: Include relevant server/browser output or write "No logs available". Remove tokens, cookies, passwords, connection strings, personal data, and private URLs. Never upload an .env file.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or screenshots
      description: Include relevant customization or a sanitized reproduction link. Check screenshots for private data.
